services:
  - type: web
    name: quantum-ledger-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@quantumledgerbusiness.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador
      # Cuenta de demostración (usuario normal, perfil activo/aprobado).
      # Se crea automáticamente en el primer arranque del despliegue.
      - key: DEMO_EMAIL
        value: demo@quantumledgerbusiness.com
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEMO_NAME
        value: Usuario Demo
